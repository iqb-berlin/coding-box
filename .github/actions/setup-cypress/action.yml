name: Set up Cypress
description: Install and verify the Electron binary for the installed Cypress version.
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: node -e 'console.log("version=" + require("cypress/package.json").version)' >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/Cypress
        key: cypress-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}
    - shell: bash
      env:
        CYPRESS_INSTALL_BINARY: ''
      run: |
        npx --no-install cypress install
        npx --no-install cypress verify
