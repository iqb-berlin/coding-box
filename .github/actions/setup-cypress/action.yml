name: Prepare Cypress
description: Install the Electron runtime libraries and the locked Cypress binary.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install --yes --no-install-recommends libgtk-3-0 libgbm1 libnotify4 libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/Cypress
        key: cypress-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
    - shell: bash
      env:
        CYPRESS_INSTALL_BINARY: ''
      run: npx --no-install cypress install
