name: Restore CI dependencies
description: Restore this run's Linux dependencies without losing executable bits or symlinks.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        package-manager-cache: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dependencies
        path: ${{ runner.temp }}/dependencies/
    - shell: bash
      run: tar --zstd -xf "$RUNNER_TEMP/dependencies/dependencies.tar.zst"
