name: Restore CI dependencies
description: Restore the Linux dependency tree from this workflow run, including executable bits and symlinks.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .nvmrc
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: dependencies
        path: ${{ runner.temp }}/dependencies
    - shell: bash
      run: tar --zstd -xf "$RUNNER_TEMP/dependencies/node_modules.tar.zst"
