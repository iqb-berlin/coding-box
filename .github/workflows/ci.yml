name: Kodierbox CI

on:
  # The required check runs on the PR merge commit, including for same-repository PRs.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
  push:
    branches: [develop, main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  NG_BUILD_MAX_WORKERS: '2'
  CYPRESS_INSTALL_BINARY: '0'
  CYPRESS_VERIFY_TIMEOUT: '120000'
  CI_PIPELINE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  TRIVY_IMAGE: aquasec/trivy:latest@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-fund
      - name: Archive Linux dependencies
        run: tar --zstd -cf "$RUNNER_TEMP/dependencies.tar.zst" node_modules
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependencies
          path: ${{ runner.temp }}/dependencies.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  build-app:
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-dependencies
      - run: npx --no-install nx build frontend --configuration=production
      - run: npx --no-install nx build backend --configuration=production
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-build
          path: dist/apps/
          if-no-files-found: error
          retention-days: 7

  test-backend:
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:14.25-alpine3.24@sha256:e7d9e6aac7fe3232f7661da103aebc0ce38b04105b46af5e9edd5ef6bc343f20
        env:
          POSTGRES_USER: kappa_test
          POSTGRES_PASSWORD: kappa_test
          POSTGRES_DB: postgres
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U kappa_test -d postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ['6379/tcp']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-dependencies
      - run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - run: node --test scripts/qa/junit-reporter.test.cjs
      - run: npx --no-install nx exec -- bash scripts/tests/install-migration-regression.sh
      - run: npx --no-install nx run backend:typecheck
      - run: npx --no-install nx run backend:verify-runtime-package
      - name: Run backend tests with PostgreSQL and Redis
        env:
          KAPPA_QUERY_TEST_DATABASE_URL: postgresql://kappa_test:kappa_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          BULLMQ_TEST_REDIS_HOST: '127.0.0.1'
          BULLMQ_TEST_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: npx --no-install nx test backend --configuration=ci --maxWorkers=2 --passWithNoTests=false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: backend-coverage
          path: coverage/apps/backend/
          if-no-files-found: error
          retention-days: 30

  test-backend-integration:
    name: Backend integration (PostgreSQL ${{ matrix.version }})
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '14.25'
            postgres: postgres:14.25-alpine3.24@sha256:e7d9e6aac7fe3232f7661da103aebc0ce38b04105b46af5e9edd5ef6bc343f20
          - version: '17.12'
            postgres: postgres:17.12-alpine3.24@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_USER: integration_test
          POSTGRES_PASSWORD: integration_test
          POSTGRES_DB: postgres
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U integration_test -d postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ['6379/tcp']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-dependencies
      - run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Run backend integration tests
        env:
          BACKEND_INTEGRATION_POSTGRES_VERSION: ${{ matrix.version }}
          BACKEND_INTEGRATION_TEST_DATABASE_URL: postgresql://integration_test:integration_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          BULLMQ_TEST_REDIS_HOST: '127.0.0.1'
          BULLMQ_TEST_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: npx --no-install nx run backend:test-integration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: backend-integration-${{ matrix.version }}
          path: |
            coverage/apps/backend/integration-results.json
            coverage/apps/backend/integration-junit.xml
          if-no-files-found: error
          retention-days: 30

  test-frontend:
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-dependencies
      - run: npx --no-install nx run frontend:test-quality-gates
      - run: npx --no-install nx test frontend --configuration=ci --maxWorkers=2
      - run: npx --no-install nx run frontend:e2e-coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: frontend-coverage
          path: coverage/apps/frontend/
          if-no-files-found: error
          retention-days: 30

  test-browser:
    needs: [install, build-app]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-dependencies
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-build
          path: dist/apps/
      - uses: ./.github/actions/setup-cypress
      - run: npx --no-install nx run frontend:component-test --browser=electron
      - run: npx --no-install nx run frontend:e2e --configuration=ci --browser=electron
      - if: ${{ !cancelled() }}
        run: npx --no-install nx run frontend:e2e-report --suites=component,browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: browser-proof
          path: |
            coverage/cypress/
            cypress/screenshots/
            cypress/videos/
            cypress/component-screenshots/
            cypress/component-videos/
          if-no-files-found: error
          retention-days: 7

  live-e2e:
    name: Live E2E (${{ matrix.suite }})
    needs: [install, build-app]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: replay-live
            target: e2e-replay-live
          - suite: auth-live
            target: e2e-auth-live
          - suite: workflows-live
            target: e2e-workflows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-dependencies
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-build
          path: dist/apps/
      - uses: ./.github/actions/setup-cypress
      - if: matrix.suite == 'auth-live'
        run: npx --no-install nx run frontend:test-e2e-harness
      - name: Run against production build artifacts
        env:
          E2E_TARGET: ${{ matrix.target }}
        # The existing harness hands a private 0600 realm file to Keycloak UID 1000.
        run: |
          sudo env "PATH=$PATH" "CI=$CI" "CI_PIPELINE_ID=$CI_PIPELINE_ID" \
            "NX_DAEMON=$NX_DAEMON" "NX_NO_CLOUD=$NX_NO_CLOUD" \
            "CYPRESS_CACHE_FOLDER=$HOME/.cache/Cypress" \
            "REPLAY_E2E_PREBUILT=true" \
            "REPLAY_E2E_CONNECT_HOST=127.0.0.1" "REPLAY_E2E_PUBLISH_HOST=127.0.0.1" \
            npx --no-install nx run "frontend:$E2E_TARGET" --configuration=production
      - name: Make test outputs readable by the runner
        if: ${{ !cancelled() }}
        run: |
          for output in coverage/cypress cypress/replay-artifacts tmp/replay-e2e-artifacts; do
            if sudo test -e "$output"; then
              sudo chown -R --no-dereference "$(id -u):$(id -g)" "$output"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: cypress-${{ matrix.suite }}
          path: coverage/cypress/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: live-evidence-${{ matrix.suite }}
          path: |
            cypress/replay-artifacts/
            tmp/replay-e2e-artifacts/
          retention-days: 7

  test-live-report:
    needs: [install, live-e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-dependencies
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cypress-*-live
          merge-multiple: true
          path: coverage/cypress/
      - run: npx --no-install nx run frontend:e2e-report --suites=auth-live,replay-live,workflows-live
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: live-workflow-report
          path: |
            coverage/cypress/summary.json
            coverage/cypress/summary.md
          if-no-files-found: error
          retention-days: 30

  lint:
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-dependencies
      - run: npx --no-install nx lint frontend
      - run: npx --no-install nx lint backend

  audit:
    needs: install
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-dependencies
      - run: npx --no-install nx run frontend:test-dependency-patches
      - run: npm audit --audit-level high

  database-images:
    name: Build database image (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: db
            dockerfile: database/Postgres.Dockerfile
          - image: db-pg17
            dockerfile: database/Postgres.Dockerfile
            postgres: postgres:17.12-alpine3.24@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
          - image: liquibase
            dockerfile: database/Liquibase.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and export image
        env:
          IMAGE: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          POSTGRES_IMAGE: ${{ matrix.postgres }}
        run: |
          args=()
          if [[ -n "$POSTGRES_IMAGE" ]]; then
            args+=(--build-arg "POSTGRES_IMAGE=$POSTGRES_IMAGE")
          fi
          docker build --pull --progress=plain --file "$DOCKERFILE" "${args[@]}" --tag "coding-box-$IMAGE:ci" .
          docker save "coding-box-$IMAGE:ci" | zstd -T0 -o "$RUNNER_TEMP/$IMAGE.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image }}
          path: ${{ runner.temp }}/${{ matrix.image }}.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  test-db:
    name: Liquibase migrations (${{ matrix.image }})
    needs: database-images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [db, db-pg17]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.image }}
          path: ${{ runner.temp }}/images/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-liquibase
          path: ${{ runner.temp }}/images/
      - name: Validate SQL and verify rollback on a disposable database
        env:
          DB_IMAGE: ${{ matrix.image }}
        run: bash scripts/ci/test-database.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: liquibase-proof-${{ matrix.image }}
          path: ${{ runner.temp }}/database-test.log
          if-no-files-found: error
          retention-days: 7

  production-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production base, backend and frontend images
        run: |
          docker build --pull --progress=plain --target builder --tag coding-box-base:ci .
          for project in backend frontend; do
            docker build --progress=plain --target prod \
              --build-arg "PROJECT=$project" --build-arg BASE_IMAGE_NAME=coding-box-base:ci \
              --file "apps/$project/Dockerfile" --tag "coding-box-$project:ci" .
          done
      - name: Check production startup and runtime dependencies
        env:
          BACKEND_IMAGE: coding-box-backend:ci
          POSTGRES_TEST_IMAGE: 'postgres:14.25-alpine3.24@sha256:e7d9e6aac7fe3232f7661da103aebc0ce38b04105b46af5e9edd5ef6bc343f20'
        run: bash scripts/ci/verify-production-backend.sh
      - name: Repeat runtime, test, lint and audit in the main PR test images
        if: github.base_ref == 'main' || github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main'
        run: bash scripts/ci/test-main-pr-images.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: backend-container-proof
          path: |
            container-startup.log
            dist/backend-container-proof/
            coverage/image-tests/
          if-no-files-found: error
          retention-days: 7
      - name: Export release scan inputs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          for project in backend frontend; do
            docker save "coding-box-$project:ci" | zstd -T0 -o "$RUNNER_TEMP/$project.tar.zst"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          name: app-images
          path: |
            ${{ runner.temp }}/backend.tar.zst
            ${{ runner.temp }}/frontend.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  scan-postgres17:
    needs: database-images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-db-pg17
          path: ${{ runner.temp }}/images/
      - run: bash scripts/ci/scan-image.sh db-pg17
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: scan-db-pg17
          path: ${{ runner.temp }}/trivy/report.json
          if-no-files-found: error
          retention-days: 30

  scan-production:
    name: Production scan (${{ matrix.image }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [database-images, production-images]
    continue-on-error: ${{ github.ref_type != 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: db
            artifact: image-db
          - image: liquibase
            artifact: image-liquibase
          - image: backend
            artifact: app-images
          - image: frontend
            artifact: app-images
          - image: traefik
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.image != 'traefik'
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/images/
      - name: Scan the exact built image
        env:
          IMAGE: ${{ matrix.image }}
        run: bash scripts/ci/scan-image.sh "$IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: scan-${{ matrix.image }}
          path: ${{ runner.temp }}/trivy/report.json
          if-no-files-found: error
          retention-days: 30

  release-version:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/ci/check-release-version.mjs "$GITHUB_REF_NAME"

  quality-gates:
    name: Kodierbox required checks
    if: ${{ always() }}
    needs:
      - install
      - build-app
      - test-backend
      - test-backend-integration
      - test-frontend
      - test-browser
      - live-e2e
      - test-live-report
      - lint
      - audit
      - database-images
      - test-db
      - production-images
      - scan-postgres17
      - scan-production
      - release-version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable gate to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          node --input-type=module <<'JS'
          const results = JSON.parse(process.env.RESULTS);
          const release = process.env.REF_TYPE === 'tag';
          for (const [job, { result }] of Object.entries(results)) {
            console.log(job, result);
            if (!release && job === 'scan-production') continue;
            if (!release && job === 'release-version' && result === 'skipped') continue;
            if (result !== 'success') {
              process.exitCode = 1;
            }
          }
          JS
