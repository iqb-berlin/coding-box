# Isolated diagnostic branch. Never merge this configuration into product branches.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "verify-runner-docker-hub-access-2026-11-03"'
    - when: never

stages:
  - diagnostics

verify-docker-hub-access:
  stage: diagnostics
  image: node:24.22.1-bookworm
  parallel: 2
  timeout: 5m
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    GIT_DEPTH: '1'
  services:
    - name: docker:28-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: '2375'
      entrypoint: ['sh', '-c', 'dockerd-entrypoint.sh --mtu=1392']
  script:
    - node --check scripts/qa/runner-docker-hub-proof.mjs
    - RUNNER_HUB_PROBE_SELF_TEST=1 node scripts/qa/runner-docker-hub-proof.mjs
    - node scripts/qa/runner-docker-hub-proof.mjs
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - tmp/runner-docker-hub-proof.json
