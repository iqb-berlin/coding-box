events {}
http {
  log_format fixture "$request_method $uri $status";
  access_log /dev/stdout fixture;
  server {
    listen 8080;
    location /tc17/api/ { proxy_pass http://tc17:8080/; }
    location /tc18/api/ { proxy_pass http://tc18:8080/; }
    location /tc19/api/ { proxy_pass http://tc19:8080/; }
  }
}
