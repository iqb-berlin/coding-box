services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: test-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${REPLAY_E2E_KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${REPLAY_E2E_KEYCLOAK_URL}
    volumes:
      - ${REPLAY_E2E_AUTH_DIR}/coding-e2e-realm.json:/opt/keycloak/data/import/coding-e2e-realm.json:ro
    ports:
      - '127.0.0.1:${REPLAY_E2E_KEYCLOAK_PORT}:8080'
  backend:
    environment:
      OIDC_ISSUER: ${REPLAY_E2E_OIDC_ISSUER}
      OIDC_JWKS_URI: http://keycloak:8080/realms/coding-e2e/protocol/openid-connect/certs
  frontend:
    volumes:
      - ${REPLAY_E2E_AUTH_DIR}/runtime-config.js:/usr/src/coding-box/apps/frontend/src/assets/config/runtime-config.js:ro
