services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ['start-dev', '--import-realm']
    mem_limit: 1g
    ports:
      - '127.0.0.1:18441:8080'
    volumes:
      - ./codebook-proof-realm.json:/opt/keycloak/data/import/codebook-proof-realm.json:ro
    tmpfs:
      - /opt/keycloak/data:mode=1777
  db:
    image: postgres:14.22-alpine3.22@sha256:7161c8e7347ed8b4cdefc26087702336da5f467137cc964e611c85d745df6112
    environment:
      POSTGRES_USER: codebook_test
      POSTGRES_PASSWORD: disposable_test_only
      POSTGRES_DB: codebook_test
    ports:
      - '127.0.0.1:15441:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codebook_test -d codebook_test']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:16441:6379'
  liquibase:
    image: liquibase/liquibase:4.28@sha256:7c813a2cb861f8b4718a09375c5265909127f4cb99f56bb95c956175c9b91525
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../../database/changelog:/liquibase/changelog:ro
    command:
      - --url=jdbc:postgresql://db:5432/codebook_test
      - --username=codebook_test
      - --password=disposable_test_only
      - --classpath=changelog
      - --changeLogFile=coding-box.changelog-root.xml
      - update
