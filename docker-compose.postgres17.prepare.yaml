# Start only db17 to restore/test a copy while the existing db service stays on 14.
# Stop db17 before selecting its volume as POSTGRES_DATA_VOLUME for the normal db.
services:
  db17:
    image: coding-box-postgres17:17.12
    build:
      context: .
      dockerfile: database/Postgres.Dockerfile
      args:
        POSTGRES_IMAGE: postgres:17.12-alpine3.24@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    shm_size: ${POSTGRES_SHM_SIZE:-512m}
    environment:
      POSTGRES_USER: pg17_migration_admin
      POSTGRES_PASSWORD: ${POSTGRES17_MIGRATION_ADMIN_PASSWORD:?Set a temporary staging administrator password}
      POSTGRES_DB: postgres
    volumes:
      - db17_vol:/var/lib/postgresql/data
    networks:
      - application-network

volumes:
  db17_vol:
    name: ${POSTGRES17_VOLUME_NAME:?Choose a fresh PostgreSQL 17 target volume}
    external: true
