<div class="app" [class.app--home]="homeLayout()" [style.background]="appBackground()">
  @if (appService.dataLoading) {
    <div class="spinner-container fx-column-start-center">
      <mat-spinner class="fx-flex-fix-100"></mat-spinner>
      <span class="fx-flex-fill" aria-hidden="true"></span>
    </div>
  }

  @if (!url.path().includes('replay') && !url.path().includes('print-view'))
  {
    <header class="app-header">
      <a [routerLink]="['/']" [attr.aria-label]="'home.go-home' | translate">
        <img
          [src]="appService.appLogo.data"
          [alt]="logoAltText()"
          [matTooltip]="logoAltText()"
        />
      </a>

      <h1 class="app-title">
        {{ 'ui-text.app.title' | translate }}
      </h1>

      <div class="admin-section">
        @if (currentWorkspaceName()) {
          <span class="workspace-name" [matTooltip]="currentWorkspaceName()">{{ currentWorkspaceName() }}</span>
        }

        @if (isAdminUser()) {
          <button
            mat-button
            class="icon-button-large admin-button"
            [routerLink]="['/admin']"
            [matTooltip]="'home.goto-admin' | translate"
            matTooltipPosition="above"
            data-cy="goto-admin"
           [attr.aria-label]="'home.goto-admin' | translate">
            <coding-box-wrapped-icon icon="settings"></coding-box-wrapped-icon>
          </button>
        }

        <!-- user menu -->
        @if (authService.isLoggedIn()) {
          <coding-box-user-menu></coding-box-user-menu>
        }
      </div>
    </header>
    <coding-box-system-notification-banner></coding-box-system-notification-banner>
  }
  <div class="app-main">
    <router-outlet></router-outlet>
  </div>
  <coding-box-export-toast></coding-box-export-toast>
  <coding-box-error-message-display (authenticationRestored)="handleAuthenticationRestored()"></coding-box-error-message-display>
</div>
