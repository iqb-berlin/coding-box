<mat-dialog-content>
  <h2>Nutzer Zugriffs Rechte für Arbeitsbereich(e) </h2>
  <coding-box-workspaces-selection
    (workspaceSelectionChanged)="setWorkspacesSelection($event)"
    (workspaceListReady)="workspaceListReady = $event"
    [selectedWorkspacesIds]="selectedWorkspacesIds"
    [workspacesChanged]="true" />
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button
          color="primary"
          type="submit"
          [disabled]="!workspaceListReady || isLoadingUserWorkspaces || userWorkspacesLoadingFailed"
          [mat-dialog-close]="result">
    {{ 'save' | translate }}
  </button>
  <button mat-raised-button
          type="submit"
          [mat-dialog-close]="false">
    {{ 'close' | translate }}
  </button>

</mat-dialog-actions>
