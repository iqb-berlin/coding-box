<mat-dialog-content>
  <h2>{{ 'ui-text.workspace-access-rights-dialog.nutzer-zugriffs-rechte-fuer-arbeitsbereich-e' | translate }} </h2>
  <coding-box-workspaces-selection
    (workspaceSelectionChanged)="setWorkspacesSelection($event)"
    (workspaceListReady)="workspaceListReady.set($event)"
    [selectedWorkspacesIds]="selectedWorkspacesIds()"
    [selectionDisabled]="!workspaceListReady() || isLoadingUserWorkspaces() || userWorkspacesLoadingFailed()"
    [workspacesChanged]="true" />
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button
          color="primary"
          type="submit"
          [disabled]="!workspaceListReady() || isLoadingUserWorkspaces() || userWorkspacesLoadingFailed()"
          [mat-dialog-close]="result()">
    {{ 'save' | translate }}
  </button>
  <button mat-raised-button
          type="submit"
          [mat-dialog-close]="false">
    {{ 'close' | translate }}
  </button>

</mat-dialog-actions>
