<mat-dialog-content>
  <h2>{{ 'ui-text.user-access-rights-dialog.nutzer-zugriffs-rechte-fuer-arbeitsbereich' | translate }} </h2>
<coding-box-users-selection (userSelectionChanged)="setUsersSelection($event)" [selectedUserIds] = selectedUserIds() />
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button
          color="primary"
          type="submit"
          [disabled]="isLoadingWorkspaceUsers() || workspaceUsersLoadingFailed()"
          [mat-dialog-close]="result()">
    {{ 'save' | translate }}
  </button>
  <button mat-raised-button
          type="submit"
          [mat-dialog-close]="false">
    {{ 'close' | translate }}
  </button>

</mat-dialog-actions>
