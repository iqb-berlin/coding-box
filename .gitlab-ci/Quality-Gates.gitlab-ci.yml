# Run against the complete checkout: HEAD~1/affected alone can miss earlier
# changes in a pull request and must not decide whether a release is tested.
quality-checks:
  stage: test-units
  image: ${DOCKER_HUB_PROXY}node:22.16.0-bookworm
  interruptible: true
  allow_failure: false
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "external_pull_request_event"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  variables:
    CYPRESS_INSTALL_BINARY: "0"
    NX_DAEMON: "false"
    NX_NO_CLOUD: "true"
    JEST_JUNIT_OUTPUT_DIR: "reports/junit"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npx nx lint frontend --skipNxCache
    - JEST_JUNIT_OUTPUT_NAME=frontend.xml npx nx test frontend --configuration=ci --skipNxCache
    - npx nx lint backend --skipNxCache
    - JEST_JUNIT_OUTPUT_NAME=backend.xml npx nx test backend --configuration=ci --skipNxCache
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/junit/
      - coverage/apps/frontend/
      - coverage/apps/backend/
    reports:
      junit:
        - reports/junit/frontend.xml
        - reports/junit/backend.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/apps/*/cobertura-coverage.xml
