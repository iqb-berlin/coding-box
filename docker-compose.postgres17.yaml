# Opt-in major upgrade target. See docs/database-query-hardening.md before use.
# The distinct volume prevents a PostgreSQL 17 binary from opening PostgreSQL 14 data.
services:
  db:
    image: coding-box-postgres17:local
    build:
      context: .
      dockerfile: database/Postgres.Dockerfile
      args:
        POSTGRES_IMAGE: postgres:17.11-alpine3.24@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    volumes:
      - db17_vol:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]

volumes:
  db17_vol:
